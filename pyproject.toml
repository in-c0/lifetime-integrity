[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifetime-integrity"
version = "0.1.0"
description = "Architecture-agnostic benchmarks for coherence across interrupted lifetimes"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
